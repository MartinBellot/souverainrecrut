# ======================================================
# Préparation du serveur et déploiement initial de SouverainRecrut
#   ansible-playbook -i inventory.ini playbook.yml
#
# Non intrusif pour les autres services du serveur :
#   - pas de redémarrage de la machine (signalé s'il est nécessaire) ;
#   - Docker déjà présent conservé tel quel (aucune réinstallation) ;
#   - stack isolée (projet Compose, réseau et volume dédiés).
# ======================================================
- name: Préparer le serveur et déployer SouverainRecrut
  hosts: souverainrecrut
  become: true

  # needrestart est présent sur le VPS : mode "liste seulement" pour qu'une mise
  # à jour APT ne redémarre jamais automatiquement les services en production.
  environment:
    NEEDRESTART_MODE: l
    DEBIAN_FRONTEND: noninteractive

  tasks:
    # ---------------------------------------------------------------- Système
    - name: Vérifier que le système est supporté
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family == "Debian"
          - ansible_facts.architecture == "x86_64"
        fail_msg: "Seuls Debian/Ubuntu amd64 sont supportés (trouvé : {{ ansible_facts.distribution }} {{ ansible_facts.architecture }})."
      tags: [system]

    - name: Mettre à jour le cache et les paquets du système
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        upgrade: safe
      register: system_upgrade
      tags: [system]

    - name: Installer les dépendances de base
      ansible.builtin.apt:
        name: "{{ base_packages }}"
        state: present
      tags: [system]

    - name: Vérifier si un redémarrage est nécessaire
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required
      tags: [system]

    # ---------------------------------------------------------------- Docker
    - name: Détecter une installation Docker existante
      ansible.builtin.command: docker --version
      register: docker_existing
      changed_when: false
      failed_when: false
      tags: [docker]

    - name: Installer Docker Engine depuis le dépôt officiel (serveur sans Docker)
      when: docker_existing.rc != 0
      tags: [docker]
      block:
        - name: Créer le répertoire des clés APT
          ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            mode: "0755"

        - name: Télécharger la clé GPG de Docker
          ansible.builtin.get_url:
            url: "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}/gpg"
            dest: /etc/apt/keyrings/docker.asc
            mode: "0644"

        - name: Ajouter le dépôt APT de Docker
          ansible.builtin.apt_repository:
            repo: >-
              deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
              https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}
              {{ ansible_facts.distribution_release }} stable
            filename: docker
            state: present

        - name: Installer Docker Engine et le plugin Compose
          ansible.builtin.apt:
            name:
              - docker-ce
              - docker-ce-cli
              - containerd.io
              - docker-buildx-plugin
              - docker-compose-plugin
            state: present
            update_cache: true

    - name: Activer et démarrer le service Docker
      ansible.builtin.systemd_service:
        name: docker
        enabled: true
        state: started
      tags: [docker]

    - name: Vérifier Docker Engine et le plugin Compose
      ansible.builtin.command: "{{ item }}"
      loop:
        - docker version --format "Docker Engine {{ '{{' }}.Server.Version{{ '}}' }}"
        - docker compose version
      register: docker_versions
      changed_when: false
      tags: [docker]

    # ------------------------------------------------- Utilisateur de déploiement
    - name: Créer l'utilisateur de déploiement (membre du groupe docker)
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        groups: docker
        append: true
        shell: /bin/bash
        create_home: true
      tags: [deploy-user]

    - name: Autoriser la clé SSH de déploiement (générée par Terraform)
      ansible.posix.authorized_key:
        user: "{{ deploy_user }}"
        key: "{{ deploy_public_key }}"
        exclusive: true
      tags: [deploy-user]

    # ----------------------------------------------------- Répertoire et fichiers
    - name: Créer le répertoire de déploiement
      ansible.builtin.file:
        path: "{{ deploy_dir }}"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0750"
      tags: [app]

    # .env : généré une seule fois (installation initiale). Ensuite, c'est le pipeline
    # GitLab qui le régénère à chaque déploiement depuis ses variables protégées.
    - name: Générer la configuration et les secrets initiaux (.env, admin.env)
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "{{ deploy_dir }}/{{ item }}"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0600"
        force: false
      loop: [.env, admin.env]
      no_log: true
      tags: [app]

    # Source unique : le dossier deployment/ du dépôt (le même que celui transmis par GitLab).
    - name: Installer les fichiers de déploiement (deployment/)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../deployment/{{ item.name }}"
        dest: "{{ deploy_dir }}/{{ item.name }}"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "{{ item.mode }}"
      loop:
        - { name: docker-compose.yml, mode: "0640" }
        - { name: .env.example, mode: "0640" }
        - { name: deploy.sh, mode: "0750" }
        - { name: restore.sh, mode: "0750" }
      tags: [app]

    - name: Installer le script d'amorçage du compte administrateur
      ansible.builtin.template:
        src: bootstrap-admin.js.j2
        dest: "{{ deploy_dir }}/bootstrap-admin.js"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0644"
      tags: [app]

    # ---------------------------------------------------------------- Pare-feu
    - name: Ouvrir le port de l'API dans le pare-feu
      community.general.ufw:
        rule: allow
        port: "{{ api_port }}"
        proto: tcp
        comment: "SouverainRecrut API"
      tags: [firewall]

    # -------------------------------------------------------------- Déploiement
    - name: Lire le tag actuellement déployé
      ansible.builtin.slurp:
        src: "{{ deploy_dir }}/release.env"
      register: current_release
      failed_when: false
      tags: [app]

    - name: Déployer l'image Backend (premier déploiement ou tag imposé)
      ansible.builtin.command: "./deploy.sh {{ image_tag }}"
      args:
        chdir: "{{ deploy_dir }}"
      become_user: "{{ deploy_user }}"
      register: deploy_result
      when: >-
        current_release.content is not defined
        or force_deploy | default(false) | bool
      tags: [app]

    - name: Créer le compte administrateur initial
      ansible.builtin.shell: |
        set -eu
        set -a; . ./.env; . ./admin.env; set +a
        docker compose --env-file .env --env-file release.env run --rm --no-deps \
          -e ADMIN_EMAIL -e ADMIN_PASSWORD \
          -v "{{ deploy_dir }}/bootstrap-admin.js:/app/bootstrap-admin.js:ro" \
          api node bootstrap-admin.js
      args:
        chdir: "{{ deploy_dir }}"
      become_user: "{{ deploy_user }}"
      register: admin_bootstrap
      changed_when: "'ADMIN_CREATED' in admin_bootstrap.stdout"
      tags: [app]

    # -------------------------------------------------------------- Vérifications
    - name: Vérifier les conteneurs de la stack
      ansible.builtin.command: docker compose --env-file .env --env-file release.env ps --format "{{ '{{' }}.Service{{ '}}' }} {{ '{{' }}.State{{ '}}' }} {{ '{{' }}.Health{{ '}}' }}"
      args:
        chdir: "{{ deploy_dir }}"
      register: stack_status
      changed_when: false
      tags: [verify]

    - name: Vérifier l'API et sa connexion à PostgreSQL (depuis le serveur)
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ api_port }}/v1/ready"
        return_content: true
      register: ready_local
      failed_when: ready_local.json.data.status != "READY"
      retries: 10
      delay: 3
      until: ready_local.status == 200
      tags: [verify]

    - name: Vérifier l'accès public à l'API (depuis le poste Ansible)
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:{{ api_port }}/v1/health"
      delegate_to: localhost
      become: false
      tags: [verify]

    - name: Résumé
      ansible.builtin.debug:
        msg:
          - "{{ docker_versions.results | map(attribute='stdout') | list }}"
          - "Stack : {{ stack_status.stdout_lines }}"
          - "API : http://{{ ansible_host }}:{{ api_port }}/v1 — base {{ ready_local.json.data.database }}"
          - "Admin : {{ admin_email }} (mot de passe dans {{ deploy_dir }}/admin.env)"
          - "Redémarrage du serveur nécessaire : {{ 'OUI (à planifier)' if reboot_required.stat.exists else 'non' }}"
      tags: [verify]
