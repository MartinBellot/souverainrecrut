# ======================================================
# Pipeline de déploiement — SouverainRecrut Backend
#
# Déploie sur le VPS l'image Docker Hub martinbellot/souverainrecrut-backend:<IMAGE_TAG>
# publiée par Jenkins (tests, SonarQube, Trivy). L'image n'est JAMAIS reconstruite ici.
#
#   validate ─► deploy (approbation manuelle) ─► verify ─► [rollback manuel]
#
# Variables CI/CD du projet (Settings → CI/CD → Variables), toutes "Protected" :
#   DOCKERHUB_USERNAME   Variable
#   DOCKERHUB_TOKEN      Variable — Masked and hidden
#   DEPLOY_HOST          Variable
#   DEPLOY_USER          Variable
#   SSH_PRIVATE_KEY      File     — clé privée de l'utilisateur de déploiement
#   SSH_KNOWN_HOSTS      File     — empreinte SSH du serveur (ssh-keyscan)
#   POSTGRES_PASSWORD    Variable — Masked and hidden
#   JWT_SECRET           Variable — Masked and hidden
#   IMAGE_TAG            Variable — tag à déployer (surchargeable dans "Run pipeline")
#
# Aucun secret n'est versionné ni affiché : pas de "set -x", token transmis par stdin,
# .env créé en mode 0600 puis supprimé du runner, hôte SSH vérifié (known_hosts).
# ======================================================

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api|trigger)$/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

stages:
  - validate
  - deploy
  - verify
  - rollback

variables:
  BACKEND_IMAGE: "martinbellot/souverainrecrut-backend"
  DEPLOY_DIR: "/opt/souverainrecrut"
  API_PORT: "4000"
  POSTGRES_IMAGE: "postgres:16.15-alpine3.24"
  POSTGRES_USER: "souverainrecrut"
  POSTGRES_DB: "souverainrecrut"
  FRONTEND_URL: "http://localhost:5173"
  BACKUP_KEEP: "7"
  # Format imposé : <version>-<commit> (ex. 1.0.0-727aaad) → tag immuable et traçable.
  TAG_PATTERN: '^[0-9]+\.[0-9]+\.[0-9]+-[0-9a-f]{7}$'

default:
  image: alpine:3.20

# --- Connexion SSH réutilisée par les jobs qui agissent sur le serveur
.ssh:
  before_script:
    - apk add --no-cache openssh-client curl jq >/dev/null
    - eval "$(ssh-agent -s)" >/dev/null
    - chmod 600 "$SSH_PRIVATE_KEY" && ssh-add -q "$SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
    - export TARGET="${DEPLOY_USER}@${DEPLOY_HOST}"

# =============================================================== validate
validate:tag:
  stage: validate
  before_script:
    - apk add --no-cache curl jq >/dev/null
  script:
    - |
      missing=""
      for v in DOCKERHUB_USERNAME DOCKERHUB_TOKEN DEPLOY_HOST DEPLOY_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS POSTGRES_PASSWORD JWT_SECRET IMAGE_TAG; do
        eval "val=\${$v:-}"
        [ -n "$val" ] || missing="$missing $v"
      done
      [ -z "$missing" ] || { echo "Variables CI/CD manquantes :$missing"; exit 1; }
    - echo "$IMAGE_TAG" | grep -Eq "$TAG_PATTERN" || { echo "Tag invalide « $IMAGE_TAG » (attendu <version>-<commit>)"; exit 1; }
    # Le tag doit exister sur Docker Hub et fournir une image linux/amd64 (architecture du VPS).
    - |
      token=$(curl -fsS -u "${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN}" \
        "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${BACKEND_IMAGE}:pull" | jq -r .token)
      accept="application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json"
      curl -fsS -H "Authorization: Bearer ${token}" -H "Accept: ${accept}" \
        "https://registry-1.docker.io/v2/${BACKEND_IMAGE}/manifests/${IMAGE_TAG}" -o manifest.json \
        || { echo "Tag introuvable sur Docker Hub : ${IMAGE_TAG}"; exit 1; }
      if jq -e '.manifests' manifest.json >/dev/null; then
        jq -e '.manifests[] | select(.platform.architecture == "amd64")' manifest.json >/dev/null \
          || { echo "Le tag ${IMAGE_TAG} ne contient pas d'image amd64."; exit 1; }
      else
        arch=$(curl -fsSL -H "Authorization: Bearer ${token}" \
          "https://registry-1.docker.io/v2/${BACKEND_IMAGE}/blobs/$(jq -r .config.digest manifest.json)" | jq -r .architecture)
        [ "$arch" = "amd64" ] || { echo "Le tag ${IMAGE_TAG} est en ${arch}, le VPS est en amd64."; exit 1; }
      fi
    - 'echo "✅ ${BACKEND_IMAGE}:${IMAGE_TAG} : format valide, publié sur Docker Hub, linux/amd64"'

validate:compose:
  stage: validate
  image: docker:27.4.1-cli
  script:
    - cp deployment/.env.example /tmp/check.env
    - echo "IMAGE_TAG=${IMAGE_TAG}" > /tmp/release.env
    - docker compose -f deployment/docker-compose.yml --env-file /tmp/check.env --env-file /tmp/release.env config --quiet
    - sh -n deployment/deploy.sh && sh -n deployment/restore.sh
    - echo "✅ docker-compose.yml et scripts de déploiement valides"

# =============================================================== deploy
deploy:production:
  stage: deploy
  extends: .ssh
  # Approbation manuelle : le pipeline reste bloqué tant que personne ne clique sur « Run ».
  when: manual
  allow_failure: false
  resource_group: production
  environment:
    name: production
    url: "http://${DEPLOY_HOST}:${API_PORT}/v1/info"
  script:
    # 1. Configuration : .env généré depuis les variables protégées (0600, jamais affiché)
    - umask 077
    - |
      cat > deploy.env <<EOF
      BACKEND_IMAGE=${BACKEND_IMAGE}
      API_PORT=${API_PORT}
      POSTGRES_IMAGE=${POSTGRES_IMAGE}
      POSTGRES_USER=${POSTGRES_USER}
      POSTGRES_DB=${POSTGRES_DB}
      POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      JWT_SECRET=${JWT_SECRET}
      FRONTEND_URL=${FRONTEND_URL}
      BACKUP_KEEP=${BACKUP_KEEP}
      EOF
    # 2. Transmission des fichiers de déploiement et de la configuration
    - scp -q deployment/docker-compose.yml deployment/.env.example deployment/deploy.sh deployment/restore.sh "${TARGET}:${DEPLOY_DIR}/"
    - scp -q deploy.env "${TARGET}:${DEPLOY_DIR}/.env"
    - ssh "$TARGET" "chmod 600 ${DEPLOY_DIR}/.env && chmod 750 ${DEPLOY_DIR}/deploy.sh ${DEPLOY_DIR}/restore.sh"
    # 3. Récupération de l'image Docker Hub (token par stdin) puis démarrage / mise à jour
    - printf '%s' "$DOCKERHUB_TOKEN" | ssh "$TARGET" "docker login -u '${DOCKERHUB_USERNAME}' --password-stdin" >/dev/null
    - ssh "$TARGET" "cd ${DEPLOY_DIR} && ./deploy.sh '${IMAGE_TAG}'"
  after_script:
    - rm -f deploy.env
    - apk add --no-cache openssh-client >/dev/null && eval "$(ssh-agent -s)" >/dev/null
    - chmod 600 "$SSH_PRIVATE_KEY" && ssh-add -q "$SSH_PRIVATE_KEY" && mkdir -p ~/.ssh && cp "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts
    - ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "docker logout" >/dev/null 2>&1 || true

# =============================================================== verify
verify:containers:
  stage: verify
  extends: .ssh
  needs: ["deploy:production"]
  script:
    # Attend le premier contrôle de santé Docker de l'API (jusqu'à 90 s).
    - |
      for i in $(seq 1 18); do
        ssh "$TARGET" "cd ${DEPLOY_DIR} && docker compose --env-file .env --env-file release.env ps --format '{{.Service}} {{.State}} {{.Health}} {{.Image}}'" > ps.txt
        grep -q "^api running healthy .*:${IMAGE_TAG}$" ps.txt && grep -q "^postgres running healthy" ps.txt && break
        sleep 5
      done
      cat ps.txt
    - grep -q "^api running healthy .*:${IMAGE_TAG}$" ps.txt || { echo "API non saine ou mauvais tag"; exit 1; }
    - grep -q "^postgres running healthy" ps.txt || { echo "PostgreSQL non sain"; exit 1; }
    - 'echo "✅ Conteneurs sains, API en ${IMAGE_TAG}"'

verify:api:
  stage: verify
  needs: ["deploy:production"]
  before_script:
    - apk add --no-cache curl jq >/dev/null
  script:
    - export API="http://${DEPLOY_HOST}:${API_PORT}/v1"
    - curl -fsS "$API/health" | jq -e '.data.status == "UP"'
    - curl -fsS "$API/ready"  | jq -e '.data.status == "READY" and .data.database == "CONNECTED"'
    - curl -fsS "$API/info"   | jq -e '.data.name == "SouverainRecrut API"'
    - test "$(curl -s -o /dev/null -w '%{http_code}' "http://${DEPLOY_HOST}:${API_PORT}/api-docs/")" = 200
    - test "$(curl -s -o /dev/null -w '%{http_code}' "$API/candidates")" = 401
    - |
      test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "$API/auth/login")" = 400
    - echo "✅ API accessible, base connectée, contrôle d'accès et validation actifs"

# =============================================================== rollback
rollback:production:
  stage: rollback
  extends: .ssh
  needs: []
  when: manual
  allow_failure: true
  resource_group: production
  environment:
    name: production
    url: "http://${DEPLOY_HOST}:${API_PORT}/v1/info"
  script:
    # Revient à la version déployée avec succès juste avant (release.history sur le serveur).
    - printf '%s' "$DOCKERHUB_TOKEN" | ssh "$TARGET" "docker login -u '${DOCKERHUB_USERNAME}' --password-stdin" >/dev/null
    - ssh "$TARGET" "cd ${DEPLOY_DIR} && ./deploy.sh --rollback"
  after_script:
    - apk add --no-cache openssh-client >/dev/null && eval "$(ssh-agent -s)" >/dev/null
    - chmod 600 "$SSH_PRIVATE_KEY" && ssh-add -q "$SSH_PRIVATE_KEY" && mkdir -p ~/.ssh && cp "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts
    - ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "docker logout" >/dev/null 2>&1 || true
