# ======================================================
# Stack de production SouverainRecrut : API Backend + PostgreSQL
#
# Utilisé tel quel par Ansible (installation initiale) et GitLab CI (mises à jour),
# toujours via deploy.sh :
#   docker compose --env-file .env --env-file release.env <commande>
#     .env         configuration et secrets (jamais versionné, cf. .env.example)
#     release.env  tag de l'image déployée (IMAGE_TAG), écrit par deploy.sh
#
# L'image n'est jamais reconstruite ici : elle est tirée de Docker Hub.
# ======================================================
name: souverainrecrut

x-backend-image: &backend-image "${BACKEND_IMAGE:-martinbellot/souverainrecrut-backend}:${IMAGE_TAG:?IMAGE_TAG requis (release.env)}"

x-database-url: &database-url "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16.15-alpine3.24}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
    logging: *logging
    # Aucun port publié : la base n'est joignable que depuis le réseau "backend".

  # Migrations Prisma : conteneur ponctuel exécuté avant chaque démarrage de l'API.
  # "migrate deploy" n'applique que les migrations versionnées non encore appliquées
  # (jamais de reset ni de génération de migration en production).
  migrate:
    image: *backend-image
    command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [backend]
    logging: *logging

  api:
    image: *backend-image
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      API_VERSION: v1
      DATABASE_URL: *database-url
      JWT_SECRET: ${JWT_SECRET:?}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/v1/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks: [backend]
    logging: *logging

networks:
  backend:
    name: souverainrecrut_backend

volumes:
  pgdata:
    name: souverainrecrut_pgdata
