# Base PostgreSQL éphémère dédiée aux tests E2E.
# Démarrage : npm run test:db:up   —   Arrêt : npm run test:db:down
services:
  postgres-test:
    image: postgres:16-alpine
    container_name: souverainrecrut-postgres-test
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: souverainrecrut_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d souverainrecrut_test"]
      interval: 2s
      timeout: 3s
      retries: 15
