# ======================================================
# Analyse SonarQube — Backend SouverainRecrut
# Lancée depuis backend/ (Jenkins : withSonarQubeEnv + sonar-scanner).
# L'URL et le token du serveur sont fournis par Jenkins, jamais ici.
# ======================================================
sonar.projectKey=souverainrecrut-backend
sonar.projectName=SouverainRecrut — Backend
sonar.sourceEncoding=UTF-8

# Code de production et code de test
sonar.sources=src
sonar.tests=tests
sonar.exclusions=**/README.md

# Couverture (Jest / lcov) et résultats d'exécution des tests
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=coverage/sonar-report.xml

# La documentation OpenAPI est de la donnée déclarative (objets littéraux
# volontairement répétitifs) : exclue de la détection de duplication.
sonar.cpd.exclusions=src/docs/**

# Le point d'entrée server.ts et la config sont couverts mais n'ont pas de logique métier.
sonar.typescript.tsconfigPaths=tsconfig.json
